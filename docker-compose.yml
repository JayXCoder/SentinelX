# SentinelX — full stack (one command)
#   docker compose up -d --build
# Optional profiles:
#   --profile ai            SGLang / Qwen (requires NVIDIA GPU)
#   --profile intelligence  Kai Zhe intelligence API (when implemented)

name: sentinelx

networks:
  sentinelx:
    driver: bridge

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://sentinelx:sentinelx@postgres:5432/sentinelx
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  QDRANT_URL: http://qdrant:6333
  SGLANG_BASE_URL: http://sglang_qwen:30000
  SGLANG_MODEL: Qwen/Qwen3.5-2B
  BRIGHT_DATA_ENABLED: ${BRIGHT_DATA_ENABLED:-false}
  BRIGHT_DATA_USERNAME: ${BRIGHT_DATA_USERNAME:-}
  BRIGHT_DATA_PASSWORD: ${BRIGHT_DATA_PASSWORD:-}
  HF_TOKEN: ${HF_TOKEN:-}
  HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}

x-frontend-build-args: &frontend-build-args
  NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
  NEXT_PUBLIC_INTELLIGENCE_API_URL: ${NEXT_PUBLIC_INTELLIGENCE_API_URL:-http://localhost:4001}
  NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - sentinelx
    environment:
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx
      POSTGRES_DB: sentinelx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "4543:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx -d sentinelx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - sentinelx
    ports:
      - "4637:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    networks:
      - sentinelx
    ports:
      - "4633:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  sglang_qwen:
    image: lmsysorg/sglang:latest
    restart: unless-stopped
    profiles: ["ai"]
    networks:
      - sentinelx
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command: >
      python3 -m sglang.launch_server
      --model-path Qwen/Qwen3.5-2B
      --host 0.0.0.0
      --port 30000
    ports:
      - "4300:30000"
    volumes:
      - sglang_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build:
      context: ./sentinelx-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - sentinelx
    environment:
      <<: *backend-env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  celery_worker:
    build:
      context: ./sentinelx-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - sentinelx
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "-Q", "celery"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      api:
        condition: service_healthy

  celery_beat:
    build:
      context: ./sentinelx-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - sentinelx
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./sentinelx-frontend
      dockerfile: Dockerfile
      args:
        <<: *frontend-build-args
    restart: unless-stopped
    networks:
      - sentinelx
    ports:
      - "4002:3000"
    environment:
      <<: *frontend-build-args
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Kai Zhe — intelligence layer (scaffold; enable when Dockerfile is implemented)
  intelligence_api:
    profiles: ["intelligence"]
    networks:
      - sentinelx
    build:
      context: ./sentinelx-intelligence
      dockerfile: Dockerfile
    ports:
      - "4001:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  sglang_cache:
