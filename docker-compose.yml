name: sentinelx

networks:
  sentinelx:
    driver: bridge

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://sentinelx:sentinelx@postgres:5432/sentinelx
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  QDRANT_URL: http://qdrant:6333
  SGLANG_BASE_URL: http://sglang_qwen:30000
  SGLANG_MODEL: Qwen/Qwen3.5-2B
  BRIGHT_DATA_ENABLED: ${BRIGHT_DATA_ENABLED:-false}
  BRIGHT_DATA_USERNAME: ${BRIGHT_DATA_USERNAME:-}
  BRIGHT_DATA_PASSWORD: ${BRIGHT_DATA_PASSWORD:-}
  HF_TOKEN: ${HF_TOKEN:-}
  HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - sentinelx
    environment:
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx
      POSTGRES_DB: sentinelx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "4543:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx -d sentinelx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - sentinelx
    ports:
      - "4637:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    networks:
      - sentinelx
    ports:
      - "4633:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  sglang_qwen:
    image: lmsysorg/sglang:latest
    restart: unless-stopped
    profiles: ["ai", "full"]
    networks:
      - sentinelx
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command: >
      python3 -m sglang.launch_server
      --model-path Qwen/Qwen3.5-2B
      --host 0.0.0.0
      --port 30000
    ports:
      - "4300:30000"
    volumes:
      - sglang_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build:
      context: ./sentinelx-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - sentinelx
    environment:
      <<: *backend-env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  celery_worker:
    build:
      context: ./sentinelx-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - sentinelx
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "-Q", "celery"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  celery_beat:
    build:
      context: ./sentinelx-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - sentinelx
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy

  # Kai Zhe — intelligence layer
  intelligence_api:
    profiles: ["intelligence", "full"]
    networks:
      - sentinelx
    build:
      context: ./sentinelx-intelligence
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinelx:sentinelx@postgres:5432/sentinelx
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      SGLANG_BASE_URL: http://sglang_qwen:30000
      SGLANG_MODEL: Qwen/Qwen3.5-2B
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  intel_celery_worker:
    profiles: ["intelligence", "full"]
    networks:
      - sentinelx
    build:
      context: ./sentinelx-intelligence
      dockerfile: Dockerfile
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinelx:sentinelx@postgres:5432/sentinelx
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      SGLANG_BASE_URL: http://sglang_qwen:30000
      SGLANG_MODEL: Qwen/Qwen3.5-2B
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  intel_celery_beat:
    profiles: ["intelligence", "full"]
    networks:
      - sentinelx
    build:
      context: ./sentinelx-intelligence
      dockerfile: Dockerfile
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinelx:sentinelx@postgres:5432/sentinelx
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  # Raymond + Geng Xin — frontend (scaffold)
  frontend:
    profiles: ["frontend"]
    networks:
      - sentinelx
    build:
      context: ./sentinelx-frontend
      dockerfile: Dockerfile
    ports:
      - "4002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_INTELLIGENCE_API_URL: http://localhost:4001

volumes:
  postgres_data:
  qdrant_data:
  sglang_cache:
