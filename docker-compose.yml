# SentinelX — ChamPeng full stack
#   docker compose up -d --build
#   docker compose --profile ai up -d --build   # + SGLang / Qwen/Qwen3.5-2B (NVIDIA GPU)
#   ./scripts/bootstrap-champeng.sh             # seed sources + demo intelligence

name: sentinelx

networks:
  sentinelx:
    driver: bridge

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://sentinelx:sentinelx@postgres:5432/sentinelx}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  SGLANG_BASE_URL: ${SGLANG_BASE_URL:-http://sglang_qwen:30000}
  SGLANG_MODEL: ${SGLANG_MODEL:-Qwen/Qwen3.5-2B}
  BRIGHT_DATA_ENABLED: ${BRIGHT_DATA_ENABLED:-false}
  BRIGHT_DATA_API_KEY: ${BRIGHT_DATA_API_KEY:-}
  BRIGHT_DATA_ZONE: ${BRIGHT_DATA_ZONE:-sentinelx}
  BRIGHT_DATA_USERNAME: ${BRIGHT_DATA_USERNAME:-}
  BRIGHT_DATA_PASSWORD: ${BRIGHT_DATA_PASSWORD:-}
  HF_TOKEN: ${HF_TOKEN:-}
  HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
  SENTINELX_INTEL_URL: http://intelligence_api:4001
  API_KEY: ${API_KEY:-}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}

x-intel-env: &intel-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://sentinelx:sentinelx@postgres:5432/sentinelx}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  SGLANG_BASE_URL: ${SGLANG_BASE_URL:-http://sglang_qwen:30000}
  SGLANG_MODEL: ${SGLANG_MODEL:-Qwen/Qwen3.5-2B}
  SGLANG_TIMEOUT_SECONDS: ${SGLANG_TIMEOUT_SECONDS:-120.0}
  SGLANG_MAX_RETRIES: ${SGLANG_MAX_RETRIES:-3}
  SENTINELX_DEBUG: ${SENTINELX_DEBUG:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}
  STREAM_MAX_LEN: ${STREAM_MAX_LEN:-10000}
  STREAM_BLOCK_MS: ${STREAM_BLOCK_MS:-5000}
  CONSUMER_GROUP: ${CONSUMER_GROUP:-intelligence_layer}
  CONSUMER_NAME: ${CONSUMER_NAME:-intel_worker_1}
  CORRELATION_TIME_WINDOW_HOURS: ${CORRELATION_TIME_WINDOW_HOURS:-72}
  CORRELATION_MIN_SIGNALS: ${CORRELATION_MIN_SIGNALS:-2}
  API_KEY: ${API_KEY:-}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}

x-frontend-build-args: &frontend-build-args
  NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
  NEXT_PUBLIC_INTELLIGENCE_API_URL: ${NEXT_PUBLIC_INTELLIGENCE_API_URL:-http://localhost:4001}
  NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - sentinelx
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelx}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-4543}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelx} -d ${POSTGRES_DB:-sentinelx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - sentinelx
    ports:
      - "${REDIS_PORT:-4637}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    networks:
      - sentinelx
    ports:
      - "${QDRANT_PORT:-4633}:6333"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - qdrant_data:/qdrant/storage

  sglang_qwen:
    image: lmsysorg/sglang:latest
    restart: unless-stopped
    profiles: ["ai", "full"]
    networks:
      - sentinelx
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command: >
      python3 -m sglang.launch_server
      --model-path ${SGLANG_MODEL:-Qwen/Qwen3.5-2B}
      --host 0.0.0.0
      --port 30000
    ports:
      - "${SGLANG_PORT:-4300}:30000"
    volumes:
      - sglang_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    image: sentinelx-api:latest
    build:
      context: ./sentinelx-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - sentinelx
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  celery_worker:
    image: sentinelx-api:latest
    build:
      context: ./sentinelx-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - sentinelx
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "-Q", "celery"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      api:
        condition: service_healthy

  celery_beat:
    image: sentinelx-api:latest
    build:
      context: ./sentinelx-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - sentinelx
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  intelligence_api:
    image: sentinelx-intelligence:latest
    networks:
      - sentinelx
    build:
      context: ./sentinelx-intelligence
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${INTEL_PORT:-4001}:4001"
    environment:
      <<: *intel-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  intel_celery_worker:
    image: sentinelx-intelligence:latest
    networks:
      - sentinelx
    build:
      context: ./sentinelx-intelligence
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      <<: *intel-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      intelligence_api:
        condition: service_healthy

  intel_celery_beat:
    image: sentinelx-intelligence:latest
    networks:
      - sentinelx
    build:
      context: ./sentinelx-intelligence
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *intel-env
    depends_on:
      redis:
        condition: service_healthy
      intelligence_api:
        condition: service_healthy

  frontend:
    image: sentinelx-frontend:latest
    networks:
      - sentinelx
    build:
      context: ./sentinelx-frontend
      dockerfile: Dockerfile
      args:
        <<: *frontend-build-args
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4002}:3000"
    environment:
      <<: *frontend-build-args
      SENTINELX_API_KEY: ${API_KEY:-}
      API_BACKEND_URL: http://api:4000
      API_INTELLIGENCE_URL: http://intelligence_api:4001
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:-}
    depends_on:
      api:
        condition: service_healthy
      intelligence_api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
  qdrant_data:
  sglang_cache:
