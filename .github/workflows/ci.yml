name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  DATABASE_URL: postgresql+psycopg2://sentinelx:sentinelx@localhost:4543/sentinelx
  REDIS_URL: redis://localhost:4637/0
  CELERY_BROKER_URL: redis://localhost:4637/0
  CELERY_RESULT_BACKEND: redis://localhost:4637/1
  QDRANT_URL: http://localhost:4633
  SGLANG_BASE_URL: http://localhost:4300
  SGLANG_MODEL: Qwen/Qwen3.5-2B
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_API_URL: http://localhost:4000
  NEXT_PUBLIC_INTELLIGENCE_API_URL: http://localhost:4001

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: sentinelx
          POSTGRES_DB: sentinelx
        ports:
          - 4543:5432
        options: >-
          --health-cmd "pg_isready -U sentinelx -d sentinelx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 4637:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 4633:6333

    defaults:
      run:
        working-directory: sentinelx-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sentinelx-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinelx-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sentinelx-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_INTELLIGENCE_API_URL: ${{ env.NEXT_PUBLIC_INTELLIGENCE_API_URL }}

  backend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t sentinelx-backend:ci ./sentinelx-backend

  frontend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:4000 \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 \
            --build-arg NEXT_PUBLIC_INTELLIGENCE_API_URL=http://localhost:4001 \
            -t sentinelx-frontend:ci \
            ./sentinelx-frontend

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate default stack compose file
        run: docker compose config --quiet

      - name: Validate optional AI profile
        run: docker compose --profile ai config --quiet

  stack-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build default stack images (api + frontend)
        run: |
          docker compose build api frontend

  intelligence-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: sentinelx
          POSTGRES_DB: sentinelx
        ports:
          - 4543:5432
        options: >-
          --health-cmd "pg_isready -U sentinelx -d sentinelx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 4637:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 4633:6333

    defaults:
      run:
        working-directory: sentinelx-intelligence

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sentinelx-intelligence/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing

  compose-prod-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
