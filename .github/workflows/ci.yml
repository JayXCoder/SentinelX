name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  DATABASE_URL: postgresql+psycopg2://sentinelx:sentinelx@localhost:4543/sentinelx
  REDIS_URL: redis://localhost:4637/0
  CELERY_BROKER_URL: redis://localhost:4637/0
  CELERY_RESULT_BACKEND: redis://localhost:4637/1
  QDRANT_URL: http://localhost:4633
  SGLANG_BASE_URL: http://localhost:4300
  SGLANG_MODEL: Qwen/Qwen3.5-2B

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: sentinelx
          POSTGRES_DB: sentinelx
        ports:
          - 4543:5432
        options: >-
          --health-cmd "pg_isready -U sentinelx -d sentinelx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 4637:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 4633:6333

    defaults:
      run:
        working-directory: sentinelx-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sentinelx-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

  backend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t sentinelx-backend:ci ./sentinelx-backend

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config

  frontend-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify frontend scaffold exists
        run: test -f sentinelx-frontend/README.md

  intelligence-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify intelligence scaffold exists
        run: test -f sentinelx-intelligence/README.md
